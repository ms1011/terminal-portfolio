spring:
  application:
    name: portfolio-api

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  metrics:
    tags:
      application: portfolio-api

app:
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "https://*.vercel.app"
  intro:
    token-delay-min-ms: 30
    token-delay-max-ms: 60
    newline-pause-ms: 500
  presence:
    heartbeat-interval-ms: 10000
    wave-rate-limit: 5
